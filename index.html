<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dice-lite — playground</title>
<meta name="description" content="A throw of dice on a table, drawn by code: seeded dice on a brand-coloured felt, line or flat, as an SVG string.">
<style>
	:root { --bg: #111318; --panel: #1a1d24; --text: #e6e6e6; --muted: #9aa0aa; --line: #2b2f38; --accent: #00abf3; }
	body.light { --bg: #f4f5f8; --panel: #ffffff; --text: #1d2026; --muted: #5d6470; --line: #dfe2e8; --accent: #0084bd; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
	main { display: grid; grid-template-columns: 18rem 1fr; min-height: 100vh; }
	aside { padding: 16px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
	h1 { font-size: 16px; margin: 0; }
	label, .field { display: grid; grid-template-columns: 5.5rem 1fr; align-items: center; gap: 8px; color: var(--muted); }
	input[type=text], select { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
	.row { display: flex; gap: 6px; align-items: center; }
	button { padding: 4px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	.brand input { width: 2.2rem; height: 1.6rem; padding: 0; border: 0; background: none; }
	#stage { display: grid; place-items: center; padding: 24px; }
	/* the throw is a wide felt: the single view is capped by width, the height follows */
	#stage > svg { width: min(52rem, 100%); height: auto; }
	/* align-content, or the rows share the stage's full height and a short sheet splits in two */
	#stage.sheet { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); align-items: start; align-content: start; gap: 16px; }
	#stage.sheet figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
	#stage.sheet figure[data-seed] { cursor: pointer; }
	#stage.sheet svg { width: 100%; height: auto; display: block; }
	#stage.icons { grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); }
	#stage.icons figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
	#stage.icons svg { width: 100%; height: auto; display: block; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
	.meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
	footer { margin-top: auto; color: var(--muted); font-size: 12px; }
	a { color: var(--accent); }
	@media (max-width: 48rem) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
	<aside id="panel">
		<h1>dice-lite</h1>
		<label>seed <input type="text" data-k="seed" value="1"></label>
		<div class="row"><button id="prev">‹</button><button id="random">random</button><button id="next">›</button></div>
		<label>show <select id="mode">
			<option value="one">one throw</option>
			<option value="sheet">contact sheet (24 seeds)</option>
			<option value="results">every result</option>
			<option value="dice">the six faces</option>
		</select></label>
		<label>theme <select data-k="theme"><option>dark</option><option>light</option></select></label>
		<label class="brand">brand <span class="row"><input type="color" data-b="0" value="#00abf3"><input type="color" data-b="1" value="#d6af3c"><input type="color" data-b="2" value="#a91455"><button id="spintax" title="the spintax triad">↺</button></span></label>
		<label>style <select data-k="style"><option value="auto">auto — table by theme</option><option>flat</option><option>line</option></select></label>
		<label>dice <select data-k="dice"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
		<label>result <select data-k="result"><option value="">— the seed's —</option><option>lucky7</option><option>snake</option><option>boxcars</option><option>matched</option><option>mixed</option></select></label>
		<label>values <input type="text" data-k="values" placeholder="e.g. 4,,2" title="comma list; empty = the seed/result"></label>
		<label>lattice <select data-k="lattice"><option>auto</option><option>trigon</option><option>hex</option><option>octagon</option><option>none</option></select></label>
		<label>weight <input type="range" data-k="weight" min="0.4" max="2.5" step="0.1" value="1"></label>
		<label>motion <span class="row"><input type="checkbox" data-k="motion"><input type="range" data-k="speed" min="0" max="4" step="0.25" value="1" title="speed — 0 returns the static bytes"><button id="replay" title="roll again">↻</button></span></label>
		<p class="meta" id="rm" hidden>Your system asks for reduced motion: the roll is shown at rest, as the library intends.</p>
		<p class="meta" id="bytes"></p>
		<footer>Made in <a href="https://301.st">301</a> · for <a href="https://spintax.net">spintax.net</a></footer>
	</aside>
	<section id="stage"></section>
</main>
<script>
	// The library is loaded cache-busted: a stale cached script once produced a convincing false
	// FAIL in a sibling's verify page, and a playground showing yesterday's throw is the same
	// trap. If a file:// load refuses the query, the plain path is tried once.
	(function () {
		var s = document.createElement('script');
		s.src = 'dice.js?ts=' + Date.now();
		s.onload = app;
		s.onerror = function () { var t = document.createElement('script'); t.src = 'dice.js'; t.onload = app; document.head.appendChild(t); };
		document.head.appendChild(s);
	})();

	function app() {
		var TRIAD = ['#00abf3', '#d6af3c', '#a91455'];
		var RESULTS = ['lucky7', 'snake', 'boxcars', 'matched', 'mixed'];
		var FACES = ['one', 'two', 'three', 'four', 'five', 'six'];
		// the panel starts on the library's own defaults, so the first render IS Dice.toss()
		var opts = { seed: '1', theme: 'dark', brand: TRIAD.slice(), style: 'auto', dice: 3,
			result: '', values: '', lattice: 'auto', weight: 1, motion: false, speed: 1 };
		var stage = document.getElementById('stage'), mode = document.getElementById('mode');
		var seedInput = document.querySelector('[data-k=seed]'), bytes = document.getElementById('bytes');

		// an empty field is not a seed: it would fall through to the string branch
		function seedValue() { return /^\d+$/.test(opts.seed) ? Number(opts.seed) : (opts.seed || 1); }
		// "4,,2" pins faces 4 and 2, the empty die follows the seed/result; an empty field pins
		// nothing and is left out, so the plain call's bytes stay reachable
		function valuesList() {
			if (!opts.values.trim()) return null;
			return opts.values.split(',').map(function (x) {
				var n = Number(x.trim());
				return Number.isInteger(n) && n >= 1 && n <= 6 ? n : null;
			});
		}
		// what the controls mean, as options the library reads. 'auto' and an empty result are
		// the panel's words for the library defaults — pass nothing. dice/weight/speed arrive as
		// strings and are converted. An explicit values: null in `extra` suppresses a typed list
		// (the results mode shows results, and values would win over them).
		function live(extra) {
			var o = Object.assign({}, opts, { seed: seedValue(), dice: Number(opts.dice), weight: Number(opts.weight) }, extra || {});
			var values = valuesList();
			if (o.style === 'auto') delete o.style;
			if (o.lattice === 'auto') delete o.lattice;
			if (!o.result) delete o.result;
			if (extra && extra.values === null) delete o.values;
			else if (values) o.values = values; else delete o.values;
			if (!o.motion) { delete o.motion; delete o.speed; }
			return o;
		}
		function tile(markup, caption, seed) {
			return '<figure' + (seed == null ? '' : ' data-seed="' + seed + '"') + '>' +
				markup + '<figcaption>' + caption + '</figcaption></figure>';
		}
		// die() reads the common options only: tossing keys (dice/result/values/lattice/motion)
		// are dropped, not passed along. The value is not in the id key, so the six icons salt by
		// it — same seed, or they would share one set of ids on this page.
		function dieOpts(o, value) {
			var d = { seed: o.seed, brand: o.brand, theme: o.theme, weight: o.weight, salt: 'face:' + value };
			if (o.style) d.style = o.style;
			d.value = value;
			return d;
		}

		function render() {
			document.body.classList.toggle('light', opts.theme === 'light');
			var o = live(), list = [], html = '', i;
			stage.className = '';
			if (mode.value === 'sheet') {
				stage.className = 'sheet';
				// a string seed varies by suffix — 'example.com-7' is a seed like any other
				var num = typeof o.seed === 'number';
				for (i = 0; i < 24; i++) {
					var s = num ? o.seed + i : o.seed + '-' + i;
					var m = Dice.toss(live({ seed: s }));
					list.push(m);
					html += tile(m, String(s), s);
				}
			} else if (mode.value === 'results') {
				stage.className = 'sheet';
				// values win over result in the library; here the mode exists to show results,
				// so a typed values list steps aside. The tiles share the seed, and the result is
				// not in the id key — each salts by its caption, or six pictures on this page
				// would answer to one set of ids.
				var caps = ["the seed's"].concat(RESULTS);
				for (i = 0; i < caps.length; i++) {
					var r = i === 0 ? '' : RESULTS[i - 1];
					var t = Dice.toss(live({ result: r, values: null, salt: caps[i] }));
					list.push(t);
					html += tile(t, caps[i]);
				}
			} else if (mode.value === 'dice') {
				stage.className = 'sheet icons';
				for (i = 1; i <= 6; i++) {
					var d = Dice.die(dieOpts(o, i));
					list.push(d);
					html += tile(d, FACES[i - 1]);
				}
			} else {
				var single = Dice.toss(o);
				list.push(single);
				html = single;
			}
			stage.innerHTML = html;
			// the strings the library returned, counted whole — innerHTML round-trips would
			// re-serialize the markup and count the browser's bytes, not ours
			var total = 0;
			for (var k = 0; k < list.length; k++) total += list[k].length;
			bytes.textContent = total + ' bytes of SVG' + (list.length > 1 ? ' in ' + list.length + ' pictures' : '');
		}
		function setSeed(v) { opts.seed = String(v); seedInput.value = opts.seed; render(); }

		document.getElementById('panel').addEventListener('input', function (e) {
			var t = e.target, k = t.getAttribute('data-k'), b = t.getAttribute('data-b');
			if (b != null) opts.brand[+b] = t.value;
			else if (k === 'motion') opts.motion = t.checked && 'roll';
			else if (k === 'dice' || k === 'weight' || k === 'speed') opts[k] = Number(t.value);
			else if (k) opts[k] = t.value;
			render();
		});
		document.getElementById('random').onclick = function () { setSeed(Math.floor(Math.random() * 1e6)); };
		document.getElementById('prev').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? Math.max(0, v - (mode.value === 'sheet' ? 24 : 1)) : 1); };
		document.getElementById('next').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? v + (mode.value === 'sheet' ? 24 : 1) : 1); };
		// the roll is one-shot: new elements start it again, and nothing else about the picture changes
		document.getElementById('replay').onclick = function () {
			if (!opts.motion) { opts.motion = 'roll'; document.querySelector('[data-k=motion]').checked = true; }
			render();
		};
		document.getElementById('spintax').onclick = function () {
			opts.brand = TRIAD.slice();
			document.querySelectorAll('[data-b]').forEach(function (el, i) { el.value = TRIAD[i]; });
			render();
		};
		stage.addEventListener('click', function (e) {
			var f = e.target.closest('figure');
			if (f && f.getAttribute('data-seed')) { mode.value = 'one'; setSeed(f.getAttribute('data-seed')); }
		});
		if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
			document.getElementById('rm').hidden = false;
		}
		render();
	}
</script>
</body>
</html>
