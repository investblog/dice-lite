name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # eslint 10 needs ^20.19.0 || ^22.13.0 || >=24; package.json engines says >=22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # A gate, not a report (ADR 006 addendum): exits 1 above package.json
      # config.sizeBudget. Measured by Node (terser + gzip level 9), never the gzip CLI,
      # whose header carries the file name.
      - name: Size gate
        run: npm run -s size
